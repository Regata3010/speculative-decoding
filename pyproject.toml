[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "speculative-decoding"
version = "0.1.0"
description = "From-scratch speculative decoding implementation with benchmarking"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.46.0",
    "accelerate>=0.25.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
include = ["src*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
